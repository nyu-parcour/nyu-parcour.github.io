# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: ParCour
email: s.westrick@nyu.edu
description: >- # this means to ignore newlines until "baseurl:"
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://nyu-parcour.github.io" # the base hostname & protocol for your site, e.g. http://example.com

# Build settings
theme: "minima"
plugins:
  - jekyll-feed

collections:
  people:
    sort_by: order
  news: 
    sort_by: date

# Social media preview (Open Graph / Twitter card), emitted by jekyll-seo-tag.
# `image` is applied as a default to every page (not collection documents,
# whose `image` key is the person's photo). The PNG is the compact symbol on a
# white 1200x1200 square with a small margin, rasterized from
# assets/logo/parcour-social.svg (see the comment in that file).
# `twitter.card: summary` renders the image as a small square icon beside the
# title on X/Twitter rather than a cropped wide banner. (Set per page here, not
# as a site-level `twitter:` key, because the latter also emits an empty
# `twitter:site` handle.)
defaults:
  - scope:
      path: ""
      type: pages
    values:
      image:
        path: /assets/logo/parcour-social.png
        width: 1200
        height: 1200
        alt: ParCour logo
      twitter:
        card: summary

minima:
  hide_site_feed_link: true
  social_links:
    - title: Github Organization
      icon: github
      url: "https://github.com/nyu-parcour"

# Sass deprecation warnings.
# Every deprecation warning at build time comes from the minima theme's own
# Sass (`@import`, and `darken()`/`lighten()` in its skins), not from this
# site. Upstream minima has not migrated yet, so silence:
#   * quiet_deps: warnings from stylesheets loaded via load paths (the theme
#     and _sass/), and
#   * import: the two `@import` rules in the theme's root assets/css/style.scss,
#     which quiet_deps does not cover.
# Warnings for deprecated Sass in this site's own files still show.
sass:
  quiet_deps: true
  silence_deprecations:
    - import

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
